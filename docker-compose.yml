services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama serve & sleep 2 && ollama pull llama3.1 2>/dev/null; wait"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null || exit 1"]
      interval: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  ollama_data:
